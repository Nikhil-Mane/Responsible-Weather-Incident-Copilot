name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,ui,agents]"
      - name: Lint
        run: |
          ruff check src tests eval app.py scripts
          ruff format --check src tests eval app.py scripts
      - name: Type check
        run: mypy
      - name: Test
        run: pytest --cov --cov-report=term-missing -m "not azure"
      - name: Evaluation gate
        run: python eval/run_eval.py
      - name: Security checks
        run: |
          bandit -r src -q
          pip-audit --ignore-vuln PYSEC-2026-311 --ignore-vuln PYSEC-2026-3813 --ignore-vuln PYSEC-2026-3814 --ignore-vuln PYSEC-2026-3815 --ignore-vuln CVE-2026-112940 --ignore-vuln CVE-2026-112913 --ignore-vuln CVE-2026-112907
